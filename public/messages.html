<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages — Easy Gig</title>

    <link rel="stylesheet" href="styles/styles.css">
</head>

<body>
    <div class="Header" id="header">
        <div class="Header-image"><a href="index.html"><img src="images/Logo.png" width="130" height="48" alt="Easy Gig"/></a></div>
        <div class="Header-obj"><a href="index.html">Home</a></div>
        <div class="Header-obj"><a href="post.html">Post</a></div>
        <div class="Header-account" id="account-menu">
            <button type="button" class="account-toggle" id="account-toggle" aria-expanded="false" aria-haspopup="true" aria-controls="account-panel">Account</button>
            <div class="account-panel" id="account-panel" hidden></div>
        </div>
    </div>

    <hr class="topline"/>

    <main class="messages-page">
        <div class="messages-layout">
            <section class="messages-inbox" aria-label="Conversations">
                <h1>Messages</h1>
                <div id="inbox-list"></div>
            </section>
            <section class="messages-thread" aria-label="Conversation">
                <h2 id="thread-title">Select a conversation</h2>
                <p id="thread-with"></p>
                <div id="thread-messages"></div>
                <p id="thread-status" class="thread-status" hidden></p>
                <form id="thread-form" hidden>
                    <label class="visually-hidden" for="thread-body">Message</label>
                    <textarea id="thread-body" name="body" maxlength="2000" rows="3" required placeholder="Write a message"></textarea>
                    <button class="display-input-button" type="submit">Send</button>
                </form>
            </section>
        </div>
    </main>

    <script src="javascript/updateHeaderScript.js"></script>
    <script src="javascript/messages.js"></script>
</body>
</html>
