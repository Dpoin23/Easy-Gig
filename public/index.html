<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Gig</title>

    <link rel="stylesheet" href="styles/styles.css">
</head>

<body id="main-body" class="main-body">
    <main>
        <div class="Header" id="header">
            <div class="Header-image"><a href="index.html"><img src="images/Logo.png" width="130" height="48" alt="Easy Gig"/></a></div>
            <div class="Header-obj"><a href="index.html">Home</a></div>
            <div class="Header-obj"><a href="post.html">Post</a></div>
            <div class="Header-account" id="account-menu">
                <button type="button" class="account-toggle" id="account-toggle" aria-expanded="false" aria-haspopup="true" aria-controls="account-panel">Account</button>
                <div class="account-panel" id="account-panel" hidden></div>
            </div>
        </div>

        <hr class="topline"/>

        <div class="search-box">
            <form id="search-form">
                <div class="search-bar" id="search-bar">
                    <div class="place-picker search-place-picker" id="search-place-picker">
                        <input type="text" placeholder="Search for a Gig" class="search-input" name="search" id="search-input">
                        <input type="hidden" name="placeId" id="search-place-id">
                        <ul class="place-suggestions" hidden></ul>
                    </div>
                    <label class="search-label">Search By:</label>
                    <select class="search-select" name="search-select" id="search-select">
                        <option value="Title">Title</option>
                        <option value="Location">Location</option>
                        <option value="Type">Type of Pay</option>
                        <option value="Pay">Pay</option>
                    </select>
                    <button type="submit" class="search-button">Find</button>
                </div>
                <div class="search-location-tools" id="search-location-tools" hidden>
                    <label class="search-distance-label" for="search-radius">Within
                        <select class="search-select search-radius" name="radius" id="search-radius">
                            <option value="5">5 miles</option>
                            <option value="10">10 miles</option>
                            <option value="25" selected>25 miles</option>
                            <option value="50">50 miles</option>
                        </select>
                    </label>
                    <button type="button" class="search-location-button" id="use-my-location">Use my location</button>
                    <p class="search-location-hint">Type a city or neighborhood. You do not have to share your device location.</p>
                    <p class="search-location-status" id="search-location-status" hidden></p>
                </div>
            </form>
        </div>

        <div id="search-results"></div>
    </main>

    <footer class="footer">
        <div class="footer-header"><strong>Contact Us</strong></div>
        <div class="footer-info">davidpoindexter03@gmail.com | 425-780-2463</div>
        <div class="footer-image"><img src="images/Logo.png" width="135" height="50"></div>
    </footer>

    <script src="javascript/updateHeaderScript.js"></script>
    <script src="javascript/placePicker.js"></script>
    <script src="javascript/gigLocation.js"></script>
    <script src="javascript/main.js"></script>
</body>

</html>
