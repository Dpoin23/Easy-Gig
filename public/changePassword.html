<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Gig</title>

    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/changePasswordStyles.css">
</head>

<body class="profile-body">
    <div class="Header" id="header">
        <div class="Header-image"><a href="index.html"><img src="images/Logo.png" width="130" height="48"/></a></div>
        <div class="Header-obj"><a href="index.html">Home</a></div>
        <div class="Header-obj"><a href="post.html">Post</a></div>
        <div class="Header-obj"><a href="createacc.html">Create Account</a></div>
        <div class="Header-obj"><a href="profile.html">Profile</a></div>
        <div class="Header-obj"><a href="signout.html">Sign Out</a></div>
    </div>

    <hr class="topline"/>
    
    <div class="change-password-div">
        <div class="change-password-box">
            <div class="change-password-header">
                <h2>Change Password</h2>
            </div>

            <form type="submit" id="newPasswordForm">
                <div class="labels-inputs">
                    <label class="newPasswordLabel"><strong>New Password</strong></label>
                    <input type="text" name="change" id="change" class="changePWInputs" required>
                    <label class="newPasswordLabel"><strong>Retype Password</strong></label>
                    <input type="text" name="confirm" id="confirm" class="changePWInputs" required>
                    <button class="changePasswordButton">Confirm Password</button>
                </div>
            </form>
        </div>
    </div>
    
    <script src="javascript/newPassword.js"></script>
</body>
</html>
